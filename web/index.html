<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Hum</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body data-phase="idle">
  <main class="screen">
    <section class="copy">
      <h1 id="headline">Hum a few seconds.</h1>
      <p id="detail">Tap to listen.</p>
    </section>
    <div id="choices" class="choices"></div>
    <div class="stage">
      <canvas id="bars" aria-hidden="true"></canvas>
      <button id="listen" class="pressable" type="button" aria-label="Listen">Listen</button>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>

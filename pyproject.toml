[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hum2song"
version = "0.1.0"
description = "Query-by-humming, whistling, and singing retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
  "soundfile>=0.12",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "wandb>=0.16",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["training/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["training/src"]

# D-042: D-041 minus the real MLEnd training whistles. D-041 overfit to the 6 MLEnd
# training tunes (held-out real whistles 41/90 vs 53 for E2b and 59 for D-040).
# Same synthetic whistle + wrong-lyrics queries, CLEWS tower, init E2b, selection on
# synthetic VAL (mean whistle/wrong-lyrics top-1) with the HumTrans +7 st guard
# (<=1 pt drop), fresh per-epoch query augmentation, early stop on that metric.
# No MLEnd data is trained on or validated on, so all 8 MLEnd songs are a clean real test.
# CLEWS batch stays 64 songs (128 ran out of GPU memory). Does not replace E2b or reindex.
run_name: contour_qsynth_d042_s0
steps: 12000
batch_size: 256
lr: 0.00003
weight_decay: 0.05
warmup_steps: 300
grad_clip: 1.0
dim: 256
layers: 6
heads: 4
dropout: 0.1
out_dim: 256
temperature_init: 0.07
num_workers: 16
seed: 0
log_every: 50
val_every: 250
select_metric: val/qsynth_whistle_top1,val/qsynth_wrong_lyrics_top1
guard_metric: val/humtrans_val_shift+7_top1
guard_max_drop: 0.01
qsynth_val: true
qsynth_val_max: 3000
qsynth_val_windows: 24
query_aug: true
stretch_min: 0.5
stretch_max: 1.9
warp_depth: 0.3
interval_scale: 0.25
drift_semitones: 1.0
jitter_semitones: 0.25
dropout_prob: 0.6
octave_error_prob: 0.15
query_min_s: 3.0
query_max_s: 12.0
ref_start_jitter_s: 1.0
ref_extra_min_s: -1.0
ref_extra_max_s: 3.0
shift_semitones: 7.0
synthetic_midi_dirs: ""
holdout_midi_dir: raw/essen_midi/deutschl
holdout_count: 2000
synthetic_exclude: ""
whistle_aug_prob: 0.0
whistle_synth: false
mlend_pairs: false
mlend_repeat: 2
mlend_val: false
song_holdout: true
chad_pairs: false
chad_val: false
input_kind: contour
init_ckpt: ckpt/contour_e2b_s0/best.pt
early_stop_patience: 8
song_pairs: true
song_libraries: youtube_charts_v1
song_fma_parity: all
song_source: query_synth
query_synth_manifest: query_synth/manifest.jsonl
song_batch_size: 64
song_refs: 4
song_offset_s: 3.0
song_loss_weight: 1.0
hum_loss_weight: 0.15
clews_gamma: 5.0
clews_eps: 0.000001

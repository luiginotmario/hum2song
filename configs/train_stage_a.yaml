# Stage A. num_workers null picks min(cpu_count - 2, 28).
stage: A
encoder: mert
mert_name: m-a-p/MERT-v1-95M
sample_rate: 24000
crop_seconds: 10.0
query_min_seconds: 3.0
query_max_seconds: 12.0
song_jitter_s: 1.0
batch_size: 32
grad_accum_steps: 1
steps: 20000
warmup_steps: 500
lr_head: 0.001
lr_backbone: 0.00001
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
freeze_steps: 1000
unfreeze_top_layers: 6
temperature_init: 0.07
qtype_loss_weight: 0.1
conf_loss_weight: 0.0
conf_gamma: 2.0
proj_dim: 256
proj_hidden: 512
seed: 0
# null -> min(cpu_count - 2, 28), with pin_memory and persistent workers
num_workers: null
log_every: 20
save_every: 500
manifest: null
data_root: null
ckpt_dir: null
run_name: stage_a
augment: true
aug_pitch: true
aug_time: true
aug_noise: true
aug_gain: true
aug_eq: true
aug_rir: true
aug_codec: true
pitch_semitones: 4.0
time_stretch_min: 0.8
time_stretch_max: 1.25
snr_min_db: 3.0
snr_max_db: 30.0
gain_db: 6.0
limit: null
resume: null
dry_run: false

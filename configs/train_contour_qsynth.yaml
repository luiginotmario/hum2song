# D-040: whistle and wrong-lyrics singing as the queries, a small HumTrans term as the
# hum baseline. ContourEncoder, init from E2b. Checkpoints go to ckpt/contour_qsynth_s0/.
# This run does not replace the live E2b model and does not reindex the library.
#   python training/scripts/train_contour.py --config configs/train_contour_qsynth.yaml
# Generate the queries first: training/scripts/generate_query_synth.py
# Launch: docs/paper/results/d040/LAUNCH.md
run_name: contour_qsynth_s0
steps: 3000
batch_size: 256
lr: 0.00003
weight_decay: 0.05
warmup_steps: 100
grad_clip: 1.0
dim: 256
layers: 6
heads: 4
dropout: 0.1
out_dim: 256
temperature_init: 0.07
num_workers: 16
seed: 0
log_every: 50
val_every: 100
select_metric: val/humtrans_val_shift+7_top1
stretch_min: 0.5
stretch_max: 1.9
warp_depth: 0.3
interval_scale: 0.25
drift_semitones: 1.0
jitter_semitones: 0.25
dropout_prob: 0.6
octave_error_prob: 0.15
query_min_s: 3.0
query_max_s: 12.0
ref_start_jitter_s: 1.0
ref_extra_min_s: -1.0
ref_extra_max_s: 3.0
shift_semitones: 7.0
synthetic_midi_dirs: ""
holdout_midi_dir: raw/essen_midi/deutschl
holdout_count: 2000
synthetic_exclude: ""
whistle_aug_prob: 0.0
whistle_synth: false
mlend_pairs: false
mlend_val: false
chad_pairs: false
chad_val: false
input_kind: contour
init_ckpt: ckpt/contour_e2b_s0/best.pt
early_stop_patience: 5
song_pairs: true
song_libraries: youtube_charts_v1
song_fma_parity: all
song_source: query_synth
query_synth_manifest: query_synth/manifest.jsonl
song_batch_size: 64
song_refs: 4
song_offset_s: 3.0
song_loss_weight: 1.0
hum_loss_weight: 0.15
clews_gamma: 5.0
clews_eps: 0.000001
